<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Recuperar contraseña</title>
</head>

<body class="min-h-screen bg-[#1F2937] font-[Poppins]">

    <!-- Logo -->
    <header class="absolute top-0 left-0 p-8">

        <div class="flex items-center gap-3">

            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-9 h-9 text-blue-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">

                <path d="M9 18V5l12-2v13" stroke-width="2"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>

            </svg>

            <h1 class="text-4xl text-white font-normal"
                style="font-family:'Irish Grover', cursive;">

                PlayNote

            </h1>

        </div>

    </header>

    <!-- Contenedor -->

    <main class="flex justify-center items-center min-h-screen px-6">

        <section
            class="w-full max-w-xl bg-white/5 backdrop-blur-sm border border-white/10 rounded-3xl shadow-2xl p-12">

            <h2 class="text-5xl font-bold text-center text-[#5C8EF5]">

                Recupera tu cuenta

            </h2>

            <p class="text-center text-gray-200 text-lg mt-4 mb-10">

                Crea una nueva contraseña para continuar disfrutando de PlayNote.

            </p>

            <!-- Input -->

            <div
                class="flex items-center bg-white rounded-2xl px-5 py-4 shadow-md mb-5 border-2 border-transparent focus-within:border-blue-400 transition">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-6 h-6 text-gray-500"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V8a4 4 0 118 0v3"/>

                </svg>

                <input
                    id="nuevaContraseña"
                    type="password"
                    placeholder="Nueva contraseña"
                    class="flex-1 ml-4 bg-transparent outline-none text-lg placeholder:text-gray-400">

            </div>

            <!-- Input -->

            <div
                class="flex items-center bg-white rounded-2xl px-5 py-4 shadow-md border-2 border-transparent focus-within:border-blue-400 transition">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-6 h-6 text-gray-500"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V8a4 4 0 118 0v3"/>

                </svg>

                <input
                    id="confirmarContraseña"
                    type="password"
                    placeholder="Confirmar contraseña"
                    class="flex-1 ml-4 bg-transparent outline-none text-lg placeholder:text-gray-400">

            </div>

            <!-- Botón -->

            <button
                onclick="restablecerContraseña()"
                id="btnRestablecer"
                class="w-full mt-10 py-4 rounded-2xl bg-[#5C8EF5] text-white text-xl font-semibold shadow-lg hover:bg-[#4678E8] hover:-translate-y-1 hover:shadow-blue-500/40 transition-all duration-300">

                Restablecer contraseña

            </button>

            <!-- Cancelar -->

            <div class="flex justify-center mt-2">
                <div class="w-32 m-4 rounded-2xl bg-[#5C8EF5] px-4 py-2 hover:bg-[#4678E8] hover:-translate-y-1 hover:shadow-blue-500/40 transition-all duration-300">
                    <a href="#"
                        class="flex items-center gap-2 text-gray-300 hover:text-white transition">

                        <a href="login.html" onclick="history.back(); return false;">
                    
                            <span class="flex justify-center font-medium text-white">
                                Cancelar
                            </span>
                        </a>
                    </a>
                </div>

            </div>

        </section>

    </main>

    <script src="JS/recuperar.js"></script>

</body>

</html>
