<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="tituloPagina">PlayNote — Detalle del curso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { DEFAULT: '#0F172A', 800: '#1E293B' },
            brass: { DEFAULT: '#3B82F6', 400: '#60A5FA' },
            ivory: '#F8FAFC',
            charcoal: '#334155',
          },
          fontFamily: {
            display: ['"Fredoka"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 10px 25px -8px rgba(15, 23, 42, 0.35)',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Fredoka', sans-serif; }
  </style>
</head>
<body class="bg-charcoal min-h-screen flex items-center justify-center p-4 sm:p-8">
  <div class="w-full max-w-6xl bg-charcoal/60 rounded-2xl overflow-hidden shadow-2xl border border-ink-800">

    <header class="bg-ink px-6 sm:px-10 py-6 flex flex-wrap items-center gap-4">
      <div class="flex items-center gap-2 shrink-0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" class="text-brass-400">
          <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span class="font-display text-ivory text-xl font-semibold">PlayNote</span>
      </div>
      <h1 id="bannerCurso" class="mx-auto bg-ivory text-ink font-display font-bold uppercase tracking-wide text-sm sm:text-lg px-6 py-3 rounded-full text-center shadow-card"></h1>
    </header>

    <!-- Contenido -->
    <main class="relative bg-charcoal/90 px-6 sm:px-10 py-10">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <div class="md:col-span-1 flex flex-col gap-6">
          <div class="bg-ivory rounded-xl p-3 shadow-card">
            <div class="rounded-lg overflow-hidden aspect-[4/3]">
              <img id="imagenCurso" src="" alt="Portada del curso" class="w-full h-full object-cover" />
            </div>
            <p id="instructorCurso" class="text-ink text-sm font-medium mt-3"></p>
          </div>

          <div class="bg-ink rounded-xl p-5 text-ivory shadow-card flex-1">
            <h2 id="nombreCurso" class="font-display font-bold uppercase text-lg tracking-wide mb-3"></h2>
            <ul class="font-display text-sm space-y-1 mb-4 text-ivory/90">
              <li id="duracionCurso"></li>
              <li id="leccionesCurso"></li>
            </ul>
            <p id="nivelCurso" class="font-display text-sm leading-snug text-brass-400"></p>
          </div>
        </div>

        <div id="listaLecciones" class="md:col-span-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div class="flex justify-end mt-8">
        <a href="inscripcionCurso.html">
          <button class="bg-ink hover:bg-ink-800 transition text-ivory font-display font-bold uppercase text-sm sm:text-base px-8 py-4 rounded-full flex items-center gap-2 shadow-card">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Inscribirme
          </button>
        </a>
      </div>
    </main>
  </div>

  <template id="plantillaLeccion">
    <article class="bg-ivory rounded-xl p-3 shadow-card flex flex-col">
      <div class="rounded-lg overflow-hidden aspect-[16/10] relative">
        <img class="img-leccion w-full h-full object-cover" />
        <span class="etiqueta-leccion absolute top-2 left-2 bg-ink/60 text-ivory text-xs font-display font-semibold px-2 py-1 rounded"></span>
      </div>
      <p class="text-charcoal text-xs mt-3">36 minutos</p>
      <p class="titulo-leccion text-ink text-sm font-semibold mt-1 mb-3"></p>
      <button class="btn-iniciar mt-auto bg-ink hover:bg-ink-800 transition text-ivory font-display font-bold uppercase text-sm rounded-full py-3 flex items-center justify-center gap-2">
        Iniciar
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </article>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./JS/desCurso.js"></script>
</body>
</html>
