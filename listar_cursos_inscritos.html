<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PlayNote</title>
<link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-300">

  <!-- Navbar -->
  <nav class="bg-[#0f172a] text-white flex items-center justify-between px-8 py-4">
    <div class="flex items-center gap-2 font-bold text-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#221b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-music-icon lucide-music"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>PlayNote</span>
    </div>

    <div class="flex items-center gap-8 font-semibold text-sm tracking-wide">
      <a href="#" class="hover:text-blue-300">CURSOS</a>
      <a href="#" class="hover:text-blue-300">EXPLORAR</a>
      <a href="#" class="hover:text-blue-300">COMUNIDAD</a>
      <a href="#" class="hover:text-blue-300">PROGRESO</a>
    </div>

    <div class="relative w-70 ">
        <input
            type="text"
            placeholder="Buscar..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

        <svg xmlns="http://www.w3.org/2000/svg"
            class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
    </div>
      

    <div class="relative inline-block group">
    
        <!-- Ícono de perfil -->
        <button class="p-2 rounded-full hover:bg-gray-200 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round-icon lucide-user-round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
        </button>

        <!-- Menú desplegable -->
        <div class="text-black absolute right-0 mt-0 z-50 w-48 bg-white rounded-lg shadow-lg border border-gray-200 hidden group-hover:block">
            <a href="#" class="block px-4 py-2 text-black hover:bg-gray-100">Mi perfil</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-gray-100">Progreso</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-gray-100">Mis cursos</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-gray-100">Configuración</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-gray-100">Cerrar sesión</a>
        </div>

    </div>


    </div>
  </nav>

  <!-- Body -->
  <main class="bg-gray-700 min-h-screen px-8 py-8 relative">

    <!-- Tabs -->
    <div class="flex items-center gap-2 bg-white rounded-full w-fit px-2 py-2 shadow">
      <button class="px-5 py-2 rounded-full text-sm font-medium text-slate-700 hover:bg-slate-100">Todos los cursos</button>
      <button class="px-5 py-2 rounded-full text-sm font-semibold bg-[#0f172a] text-white">Mis cursos</button>
      <button class="px-5 py-2 rounded-full text-sm font-medium text-slate-700 hover:bg-slate-100">Populares</button>
    </div>

    <!-- En vivo badge -->
    <div class="absolute top-8 right-8 bg-[#0f172a] text-white text-sm font-medium px-4 py-2 rounded-full">
      En vivo
    </div>

    <!-- Cards -->
    <div class="flex gap-6 mt-8 flex-wrap">

      <!-- Card 1 -->
      <div class="bg-white rounded-xl shadow-md w-72 overflow-hidden">
        <div class="relative h-40">
          <img src="https://images.unsplash.com/photo-1552422535-c45813c61732?w=400" class="w-full h-full object-cover" alt="Piano">
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-slate-900">Violín: Básico en Piano</h3>
          <p class="text-sm text-slate-500 mt-1">Por Laura Martínez</p>

          <div class="flex items-center gap-4 text-sm text-slate-500 mt-3">
            <span class="flex items-center gap-1">🕐 11 horas</span>
            <span class="flex items-center gap-1">📶 30 lecciones</span>
          </div>

          <div class="mt-4">
            <span class="inline-block bg-orange-400 text-white text-xs font-semibold px-4 py-1.5 rounded-full">Finalizado</span>
          </div>

          <button class="mt-3 w-full bg-[#0f172a] text-white rounded-lg py-2.5 flex items-center justify-center gap-2 text-sm font-medium hover:bg-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
            Continuar
          </button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white rounded-xl shadow-md w-72 overflow-hidden">
        <div class="relative h-40">
          <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=400" class="w-full h-full object-cover" alt="Guitarra">
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-slate-900">Guitarra: Técnica y Expresión</h3>
          <p class="text-sm text-slate-500 mt-1">Por Alejandro Sans</p>

          <div class="flex items-center gap-4 text-sm text-slate-500 mt-3">
            <span class="flex items-center gap-1">🕐 18 horas</span>
            <span class="flex items-center gap-1">📶 40 lecciones</span>
          </div>

          <div class="mt-4">
            <span class="inline-block bg-teal-400 text-white text-xs font-semibold px-4 py-1.5 rounded-full">Activo</span>
          </div>

          <button class="mt-3 w-full bg-[#0f172a] text-white rounded-lg py-2.5 flex items-center justify-center gap-2 text-sm font-medium hover:bg-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
            Comenzar
          </button>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
