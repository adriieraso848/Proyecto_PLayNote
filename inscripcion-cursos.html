<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>Document</title>
</head>
<body>

    <div class="min-h-screen bg-cover bg-center relative" >

        <!-- Capa oscura -->
        <div class="absolute inset-0 bg-gray-700"></div>

        <!-- Contenido -->
        <div class="relative z-10">

            <!-- Navbar -->
            <nav class="bg-[#16233B] flex justify-between items-center px-8 py-4">

                <div class="flex items-center gap-5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#573ddb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-music-icon lucide-music"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <h1 class="text-white text-3xl font-bold">PlayNoteMusic</h1>
                </div>
                

                <div class="relative max-w-sm ml-auto relative w-85 max-w-md ">
                    <!-- Icono de lupa -->
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>

                    </span>

                    <!-- Caja de búsqueda -->
                    <input
                        type="text"
                        placeholder="Buscar..."
                        class="w-80 pl-12 px-0 py-1 rounded-lg border-2 border-gray-300 bg-white text-gray-800 placeholder-gray-400 focus:outline-none "
                    >
                </div>

                <!-- Perfil Usuario -->
                <div class="relative inline-block group">
    
                    <!-- Ícono de perfil -->
                    <button class="p-2 rounded-full hover:bg-sky-700 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round-icon lucide-user-round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                    </button>

                    <!-- Menú desplegable -->
                    <div class="absolute right-0 mt-0 w-48 bg-white rounded-lg shadow-lg border border-gray-200 hidden group-hover:block">
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Mi perfil</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Progreso</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Mis cursos</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Configuración</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Cerrar sesión</a>
                    </div>

                </div>

            </nav>

            <!-- Botón atrás -->
            <div class="px-8 mt-6">

                <button class="bg-[#16233B] text-white px-5 py-2 rounded-full flex items-center gap-2 hover:bg-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left-icon lucide-arrow-left"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    Atrás
                </button>

            </div>

            <!-- Imagen -->
            <div class="flex justify-center mt-5">

                <img src="img/guuitarra.jpg"
                    class="w-[420px] rounded-lg shadow-xl">

            </div>

            <!-- Título -->
            <h2 class="text-center text-white text-2xl font-black mt-4 ">
                GUITARRA: BASICO EN GUITARRA
            </h2>

            <!-- Botón -->
            <div class="flex flex-col items-center gap-4 mt-10">

                <button class="bg-[#2A334B] border-2 border-green-600 rounded-lg p-4 shadow-[inset_0_0_12px_rgba(34,197,94,0.5)] text-green-600 text-2xl font-black">
                    <span>✅ INSCRIPCIÓN REALIZADA CON ÉXITO</span>

                    <p class="text-white text-lg font-semibold mt-2">
                        Te has inscrito correctamente en el curso
                    </p>
                </button>

                <button class="bg-blue-600 text-white text-2xl rounded-lg px-20 py-5 hover:bg-[#16233B]">
                    🧭 Explorar más cursos
                </button>
                
            </div>

        </div>

    </div>

</body>
</html>
